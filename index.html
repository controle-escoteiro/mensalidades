        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 555px;
            text-align: center;

        }
        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #1e5631;
            outline: none;
        }
        button {
            background-color: #1e5631;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #143d22;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background-color: #f9f9f9;
            border: 1px solid #eee;
            text-align: left;
            display: none;
        }
        .result-title {
            font-weight: bold;
            font-size: 18px;
            color: #1e5631;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 5px;
        }
        .month-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #666;
            font-size: 13px;
            padding-bottom: 5px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 5px;
        }
        .month-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed #eee;
            font-size: 15px;
        }
        .month-row:last-child {
            border-bottom: none;
        }
        .month-name {
            flex: 2;
        }
        .month-val {
            flex: 1.5;
            color: #555;
        }
        .month-status-container {
            flex: 2;
            text-align: right;
        }
        .status-pago {
            color: #2e7d32;
            font-weight: bold;
        }
        .status-pendente {
            color: #c62828;
            font-weight: bold;
        }
        .status-isento {
            color: #1565c0;
            font-weight: bold;
        }
        .error-msg {
            color: #c62828;
            background-color: #ffebee;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>

function buscarStatus() {
    // Pega o valor digitado e extrai apenas os números fundamentais (ex: os 7 primeiros) antes de qualquer traço ou espaço
    let digitado = document.getElementById("registroInput").value.trim().replace(/[\s-]/g, "");
    if (digitado.length > 7) {
        digitado = digitado.substring(0, 7);
    }
    
    const resultBox = document.getElementById("resultBox");
    const errorBox = document.getElementById("errorBox");
    const nomeAssociado = document.getElementById("nomeAssociado");
    const listaMeses = document.getElementById("listaMeses");
    
    resultBox.style.display = "none";
    errorBox.style.display = "none";
    listaMeses.innerHTML = "";
    
    let chaveEncontrada = null;
    for (const chave in dadosEscoteiros) {
        let chaveBase = chave.replace(/[\s-]/g, "");
        if (chaveBase.length > 7) {
            chaveBase = chaveBase.substring(0, 7);
        }
        if (chaveBase === digitado && digitado !== "") {
            chaveEncontrada = chave;
            break;
        }
    }
    
    if (chaveEncontrada) {
        const jovem = dadosEscoteiros[chaveEncontrada];
        nomeAssociado.innerText = "⚜️ Associado: " + jovem.nome;
        
        jovem.meses.forEach(function(item) {
            const row = document.createElement("div");
            row.className = "month-row";
            
            const nomeMes = document.createElement("span");
            nomeMes.className = "month-name";
            nomeMes.innerText = item.mes;
            
            const valorMes = document.createElement("span");
            valorMes.className = "month-val";
            valorMes.innerText = item.status === "Isento" ? "—" : item.valor;
            
            const statusContainer = document.createElement("span");
            statusContainer.className = "month-status-container";
            
            const statusMes = document.createElement("span");
            if (item.status === "Pago") {
                statusMes.innerText = "✅ Pago";
                statusMes.className = "status-pago";
            } else if (item.status === "Isento") {
                statusMes.innerText = "⭐ Isento (Reg.)";
                statusMes.className = "status-isento";
            } else {
                statusMes.innerText = "⏳ Pendente";
                statusMes.className = "status-pendente";
            }
            
            statusContainer.appendChild(statusMes);
            row.appendChild(nomeMes);
            row.appendChild(valorMes);
            row.appendChild(statusContainer);
            listaMeses.appendChild(row);
        });
        
        resultBox.style.display = "block";
    } else {
        errorBox.style.display = "block";
    }
}
